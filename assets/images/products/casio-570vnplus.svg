<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad570" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="lcd570" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5e5d7"/>
      <stop offset="100%" stop-color="#bcd4bf"/>
    </linearGradient>
    <filter id="shadow570" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad570)"/>
  <ellipse cx="400" cy="535" rx="200" ry="24" fill="#0f172a" opacity="0.1"/>

  <g transform="translate(275, 58) rotate(3)" filter="url(#shadow570)">
    <!-- Outer Navy Frame -->
    <rect x="0" y="0" width="256" height="476" rx="22" fill="#1e3a8a"/>
    <!-- Inner Silver Faceplate -->
    <rect x="10" y="10" width="236" height="456" rx="16" fill="url(#silverPlate)"/>

    <!-- Branding -->
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#0f172a" letter-spacing="1">CASIO</text>
    <text x="24" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8">fx-570VN PLUS</text>
    <text x="232" y="38" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#475569" text-anchor="end">NATURAL-V.P.A.M.</text>

    <!-- LCD Bezel -->
    <rect x="20" y="64" width="216" height="88" rx="8" fill="#1e293b"/>
    <rect x="28" y="72" width="200" height="72" rx="4" fill="url(#lcd570)"/>

    <text x="36" y="88" font-family="monospace" font-size="9" font-weight="700" fill="#1e293b">D  Math ▲</text>
    <text x="42" y="114" font-family="monospace" font-size="17" font-weight="700" fill="#0f172a">3/4 + √(2)</text>
    <text x="218" y="136" font-family="monospace" font-size="18" font-weight="900" fill="#0f172a" text-anchor="end">= 2.1642135</text>

    <!-- Control Cluster -->
    <circle cx="42" cy="182" r="10" fill="#64748b"/><text x="42" y="168" font-family="sans-serif" font-size="7" font-weight="800" fill="#b45309" text-anchor="middle">SHIFT</text>
    <circle cx="72" cy="182" r="10" fill="#64748b"/><text x="72" y="168" font-family="sans-serif" font-size="7" font-weight="800" fill="#be123c" text-anchor="middle">ALPHA</text>

    <!-- Replay Button -->
    <ellipse cx="128" cy="192" rx="30" ry="22" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="128" y="195" font-family="sans-serif" font-size="7" font-weight="700" fill="#e2e8f0" text-anchor="middle">REPLAY</text>

    <circle cx="184" cy="182" r="10" fill="#64748b"/><text x="184" y="168" font-family="sans-serif" font-size="7" font-weight="800" fill="#334155" text-anchor="middle">MODE</text>
    <circle cx="214" cy="182" r="10" fill="#1d4ed8"/><text x="214" y="168" font-family="sans-serif" font-size="7" font-weight="800" fill="#1d4ed8" text-anchor="middle">ON</text>

    <!-- Function Keys -->
    <g fill="#334155">
      <rect x="26" y="226" width="30" height="16" rx="4"/><rect x="61" y="226" width="30" height="16" rx="4"/>
      <rect x="96" y="226" width="30" height="16" rx="4"/><rect x="131" y="226" width="30" height="16" rx="4"/>
      <rect x="166" y="226" width="30" height="16" rx="4"/><rect x="201" y="226" width="30" height="16" rx="4"/>

      <rect x="26" y="250" width="30" height="16" rx="4"/><rect x="61" y="250" width="30" height="16" rx="4"/>
      <rect x="96" y="250" width="30" height="16" rx="4"/><rect x="131" y="250" width="30" height="16" rx="4"/>
      <rect x="166" y="250" width="30" height="16" rx="4"/><rect x="201" y="250" width="30" height="16" rx="4"/>

      <rect x="26" y="274" width="30" height="16" rx="4"/><rect x="61" y="274" width="30" height="16" rx="4"/>
      <rect x="96" y="274" width="30" height="16" rx="4"/><rect x="131" y="274" width="30" height="16" rx="4"/>
      <rect x="166" y="274" width="30" height="16" rx="4"/><rect x="201" y="274" width="30" height="16" rx="4"/>
    </g>

    <!-- White Number Keypad -->
    <g font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      <rect x="26" y="308" width="36" height="28" rx="5" fill="#f8fafc"/><text x="44" y="327" fill="#0f172a">7</text>
      <rect x="68" y="308" width="36" height="28" rx="5" fill="#f8fafc"/><text x="86" y="327" fill="#0f172a">8</text>
      <rect x="110" y="308" width="36" height="28" rx="5" fill="#f8fafc"/><text x="128" y="327" fill="#0f172a">9</text>
      <rect x="152" y="308" width="36" height="28" rx="5" fill="#ea580c"/><text x="170" y="326" font-size="10" fill="#ffffff">DEL</text>
      <rect x="194" y="308" width="36" height="28" rx="5" fill="#ea580c"/><text x="212" y="326" font-size="10" fill="#ffffff">AC</text>

      <rect x="26" y="344" width="36" height="28" rx="5" fill="#f8fafc"/><text x="44" y="363" fill="#0f172a">4</text>
      <rect x="68" y="344" width="36" height="28" rx="5" fill="#f8fafc"/><text x="86" y="363" fill="#0f172a">5</text>
      <rect x="110" y="344" width="36" height="28" rx="5" fill="#f8fafc"/><text x="128" y="363" fill="#0f172a">6</text>
      <rect x="152" y="344" width="36" height="28" rx="5" fill="#f8fafc"/><text x="170" y="363" fill="#0f172a">×</text>
      <rect x="194" y="344" width="36" height="28" rx="5" fill="#f8fafc"/><text x="212" y="363" fill="#0f172a">÷</text>

      <rect x="26" y="380" width="36" height="28" rx="5" fill="#f8fafc"/><text x="44" y="399" fill="#0f172a">1</text>
      <rect x="68" y="380" width="36" height="28" rx="5" fill="#f8fafc"/><text x="86" y="399" fill="#0f172a">2</text>
      <rect x="110" y="380" width="36" height="28" rx="5" fill="#f8fafc"/><text x="128" y="399" fill="#0f172a">3</text>
      <rect x="152" y="380" width="36" height="28" rx="5" fill="#f8fafc"/><text x="170" y="399" fill="#0f172a">+</text>
      <rect x="194" y="380" width="36" height="28" rx="5" fill="#f8fafc"/><text x="212" y="399" fill="#0f172a">−</text>

      <rect x="26" y="416" width="36" height="28" rx="5" fill="#f8fafc"/><text x="44" y="435" fill="#0f172a">0</text>
      <rect x="68" y="416" width="36" height="28" rx="5" fill="#f8fafc"/><text x="86" y="435" fill="#0f172a">.</text>
      <rect x="110" y="416" width="36" height="28" rx="5" fill="#f8fafc"/><text x="128" y="434" font-size="9" fill="#0f172a">×10ˣ</text>
      <rect x="152" y="416" width="36" height="28" rx="5" fill="#f8fafc"/><text x="170" y="434" font-size="10" fill="#0f172a">Ans</text>
      <rect x="194" y="416" width="36" height="28" rx="5" fill="#f8fafc"/><text x="212" y="435" fill="#0f172a">=</text>
    </g>
  </g>
</svg>
