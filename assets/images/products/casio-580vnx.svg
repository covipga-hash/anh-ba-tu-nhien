<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1e3d4"/>
      <stop offset="100%" stop-color="#b7d2bc"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <ellipse cx="410" cy="535" rx="220" ry="26" fill="#0f172a" opacity="0.1"/>

  <!-- Slide-on Hard Case Behind/Side -->
  <g transform="translate(360, 82) rotate(7)">
    <rect x="0" y="0" width="230" height="440" rx="20" fill="#1e293b" filter="url(#dropShadow)"/>
    <rect x="10" y="10" width="210" height="420" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="115" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="3">CASIO HARD COVER</text>
  </g>

  <!-- Main Calculator Body -->
  <g transform="translate(215, 58) rotate(-4)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="256" height="476" rx="22" fill="url(#bodyGrad)" stroke="#3f3f46" stroke-width="2"/>
    <!-- Metallic Top Accent -->
    <rect x="14" y="14" width="228" height="448" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>

    <!-- Branding -->
    <text x="26" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" letter-spacing="1.5">CASIO</text>
    <text x="26" y="59" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">fx-580VN X</text>
    <text x="230" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="end">CLASSWIZ</text>

    <!-- LCD Bezel & Screen -->
    <rect x="20" y="70" width="216" height="96" rx="8" fill="#09090b" stroke="#52525b" stroke-width="1.5"/>
    <rect x="28" y="78" width="200" height="80" rx="4" fill="url(#lcdGrad)"/>
    
    <!-- LCD Math Display -->
    <text x="35" y="92" font-family="monospace" font-size="9" font-weight="700" fill="#1e293b">D  Math ▲    fx-580VN X</text>
    <line x1="34" y1="96" x2="222" y2="96" stroke="#1e293b" stroke-width="0.6" opacity="0.35"/>
    <text x="40" y="122" font-family="monospace" font-size="16" font-weight="700" fill="#0f172a">∫(x² + 2x)dx</text>
    <text x="218" y="148" font-family="monospace" font-size="20" font-weight="900" fill="#0f172a" text-anchor="end">= 12.0000</text>

    <!-- Top Control Keys & D-Pad -->
    <circle cx="42" cy="192" r="10" fill="url(#silverGrad)"/>
    <text x="42" y="178" font-family="sans-serif" font-size="7" font-weight="800" fill="#f59e0b" text-anchor="middle">SHIFT</text>
    <circle cx="72" cy="192" r="10" fill="url(#silverGrad)"/>
    <text x="72" y="178" font-family="sans-serif" font-size="7" font-weight="800" fill="#f43f5e" text-anchor="middle">ALPHA</text>

    <!-- Central D-Pad -->
    <ellipse cx="128" cy="202" rx="28" ry="22" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <ellipse cx="128" cy="202" rx="18" ry="14" fill="#1e293b"/>

    <circle cx="184" cy="192" r="10" fill="url(#silverGrad)"/>
    <text x="184" y="178" font-family="sans-serif" font-size="7" font-weight="800" fill="#e2e8f0" text-anchor="middle">MENU</text>
    <circle cx="214" cy="192" r="10" fill="#2563eb"/>
    <text x="214" y="178" font-family="sans-serif" font-size="7" font-weight="800" fill="#38bdf8" text-anchor="middle">ON</text>

    <!-- Scientific Function Grid -->
    <g fill="#27272a" stroke="#3f3f46" stroke-width="0.8">
      <rect x="26" y="232" width="30" height="16" rx="4"/><rect x="61" y="232" width="30" height="16" rx="4"/>
      <rect x="96" y="232" width="30" height="16" rx="4"/><rect x="131" y="232" width="30" height="16" rx="4"/>
      <rect x="166" y="232" width="30" height="16" rx="4"/><rect x="201" y="232" width="30" height="16" rx="4"/>

      <rect x="26" y="256" width="30" height="16" rx="4"/><rect x="61" y="256" width="30" height="16" rx="4"/>
      <rect x="96" y="256" width="30" height="16" rx="4"/><rect x="131" y="256" width="30" height="16" rx="4"/>
      <rect x="166" y="256" width="30" height="16" rx="4"/><rect x="201" y="256" width="30" height="16" rx="4"/>

      <rect x="26" y="280" width="30" height="16" rx="4"/><rect x="61" y="280" width="30" height="16" rx="4"/>
      <rect x="96" y="280" width="30" height="16" rx="4"/><rect x="131" y="280" width="30" height="16" rx="4"/>
      <rect x="166" y="280" width="30" height="16" rx="4"/><rect x="201" y="280" width="30" height="16" rx="4"/>
    </g>

    <!-- Number Keypad (White-ish / Dark Contrast) -->
    <g font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      <!-- Row 7 8 9 DEL AC -->
      <rect x="26" y="312" width="36" height="28" rx="5" fill="#3f3f46"/><text x="44" y="331" fill="#ffffff">7</text>
      <rect x="68" y="312" width="36" height="28" rx="5" fill="#3f3f46"/><text x="86" y="331" fill="#ffffff">8</text>
      <rect x="110" y="312" width="36" height="28" rx="5" fill="#3f3f46"/><text x="128" y="331" fill="#ffffff">9</text>
      <rect x="152" y="312" width="36" height="28" rx="5" fill="#2563eb"/><text x="170" y="330" font-size="10" fill="#ffffff">DEL</text>
      <rect x="194" y="312" width="36" height="28" rx="5" fill="#2563eb"/><text x="212" y="330" font-size="10" fill="#ffffff">AC</text>

      <!-- Row 4 5 6 x / -->
      <rect x="26" y="348" width="36" height="28" rx="5" fill="#3f3f46"/><text x="44" y="367" fill="#ffffff">4</text>
      <rect x="68" y="348" width="36" height="28" rx="5" fill="#3f3f46"/><text x="86" y="367" fill="#ffffff">5</text>
      <rect x="110" y="348" width="36" height="28" rx="5" fill="#3f3f46"/><text x="128" y="367" fill="#ffffff">6</text>
      <rect x="152" y="348" width="36" height="28" rx="5" fill="#27272a"/><text x="170" y="367" fill="#e2e8f0">×</text>
      <rect x="194" y="348" width="36" height="28" rx="5" fill="#27272a"/><text x="212" y="367" fill="#e2e8f0">÷</text>

      <!-- Row 1 2 3 + - -->
      <rect x="26" y="384" width="36" height="28" rx="5" fill="#3f3f46"/><text x="44" y="403" fill="#ffffff">1</text>
      <rect x="68" y="384" width="36" height="28" rx="5" fill="#3f3f46"/><text x="86" y="403" fill="#ffffff">2</text>
      <rect x="110" y="384" width="36" height="28" rx="5" fill="#3f3f46"/><text x="128" y="403" fill="#ffffff">3</text>
      <rect x="152" y="384" width="36" height="28" rx="5" fill="#27272a"/><text x="170" y="403" fill="#e2e8f0">+</text>
      <rect x="194" y="384" width="36" height="28" rx="5" fill="#27272a"/><text x="212" y="403" fill="#e2e8f0">−</text>

      <!-- Row 0 . x10 Ans = -->
      <rect x="26" y="420" width="36" height="28" rx="5" fill="#3f3f46"/><text x="44" y="439" fill="#ffffff">0</text>
      <rect x="68" y="420" width="36" height="28" rx="5" fill="#3f3f46"/><text x="86" y="439" fill="#ffffff">.</text>
      <rect x="110" y="420" width="36" height="28" rx="5" fill="#3f3f46"/><text x="128" y="438" font-size="9" fill="#ffffff">×10ˣ</text>
      <rect x="152" y="420" width="36" height="28" rx="5" fill="#27272a"/><text x="170" y="438" font-size="10" fill="#e2e8f0">Ans</text>
      <rect x="194" y="420" width="36" height="28" rx="5" fill="#3f3f46"/><text x="212" y="439" fill="#ffffff">=</text>
    </g>

    <!-- Genuine Bitex Hologram Stamp -->
    <g transform="translate(185, 456)">
      <rect x="0" y="0" width="46" height="12" rx="3" fill="#0ea5e9" opacity="0.85"/>
      <text x="23" y="9" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">BITEX ZIN</text>
    </g>
  </g>
</svg>
