<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgCombo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <filter id="comboShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgCombo)"/>

  <!-- Laminated Formula Cheat Sheet Card (Bottom Right) -->
  <g transform="translate(380, 120) rotate(6)" filter="url(#comboShadow)">
    <rect x="0" y="0" width="270" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="58" rx="14" fill="#2563eb"/>
    <rect x="0" y="42" width="270" height="16" fill="#2563eb"/>
    <text x="135" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">100 MẸO BẤM CASIO</text>
    <text x="135" y="48" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#dbeafe" text-anchor="middle">ANH BA TỰ NHIÊN • BẢN ÉP DẺO</text>

    <g fill="#f1f5f9">
      <rect x="20" y="80" width="230" height="44" rx="8"/>
      <rect x="20" y="138" width="230" height="44" rx="8"/>
      <rect x="20" y="196" width="230" height="44" rx="8"/>
      <rect x="20" y="254" width="230" height="44" rx="8"/>
    </g>
    <text x="32" y="106" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">1. Cực trị bậc 3: MENU 9 2 3</text>
    <text x="32" y="164" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">2. Min-Max Table: MENU 8</text>
    <text x="32" y="222" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">3. Tích phân: SHIFT d/dx</text>
    <text x="32" y="280" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">4. Oxyz Vector: MENU 5</text>
  </g>

  <!-- EVA Protective Hard Pouch (Left) -->
  <g transform="translate(130, 95) rotate(-5)" filter="url(#comboShadow)">
    <rect x="0" y="0" width="235" height="390" rx="34" fill="url(#pouchGrad)" stroke="#475569" stroke-width="4"/>
    <rect x="14" y="14" width="207" height="362" rx="24" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 5"/>
    <!-- Zipper Pull -->
    <rect x="228" y="85" width="16" height="32" rx="5" fill="#94a3b8"/>
    <!-- Emblem -->
    <rect x="52" y="160" width="130" height="46" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="117" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">CASIO CASE</text>
    <text x="117" y="197" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle">CHỐNG SỐC 3 LỚP</text>
  </g>

  <!-- 2 Maxell Japan Silver Batteries -->
  <g transform="translate(360, 415)" filter="url(#comboShadow)">
    <circle cx="48" cy="48" r="44" fill="url(#coinGrad)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="48" cy="48" r="36" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="48" y="42" font-family="sans-serif" font-size="11" font-weight="900" fill="#1e293b" text-anchor="middle">maxell</text>
    <text x="48" y="56" font-family="sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">CR2032 / LR44</text>
    <text x="48" y="68" font-family="sans-serif" font-size="6.5" font-weight="800" fill="#2563eb" text-anchor="middle">JAPAN ZIN</text>

    <circle cx="145" cy="54" r="44" fill="url(#coinGrad)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="145" cy="54" r="36" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="145" y="48" font-family="sans-serif" font-size="11" font-weight="900" fill="#1e293b" text-anchor="middle">maxell</text>
    <text x="145" y="62" font-family="sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">CR2032 / LR44</text>
    <text x="145" y="74" font-family="sans-serif" font-size="6.5" font-weight="800" fill="#2563eb" text-anchor="middle">JAPAN ZIN</text>
  </g>

  <!-- Sleek Pencil (Diagonal Right) -->
  <g transform="translate(650, 90) rotate(22)" filter="url(#comboShadow)">
    <rect x="0" y="0" width="14" height="330" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="14" height="40" rx="3" fill="#2563eb"/>
    <polygon points="0,330 14,330 7,358" fill="#cbd5e1"/>
    <polygon points="4,348 10,348 7,358" fill="#0f172a"/>
  </g>
</svg>
